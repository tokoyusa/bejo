    <script>
      // Protect window.fetch against browser extensions that attempt to overwrite it with getters/setters
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(fn) { originalFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress unhandled extension interceptor errors from crashing app
        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('fetch of #<Window>') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
